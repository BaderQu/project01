<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
</head>
<body>
  <h1>User Registration</h1>

  <form action="#" method="post">

    <label for="fullname">Full Name</label><br>
    <input type="text" id="fullname" name="fullname" required minlength="3"><br><br>

    <label for="email">Email</label><br>
    <input type="email" id="email" name="email" required><br><br>

    <label for="password">Password (at least 8 characters)</label><br>
    <input type="password" id="password" name="password" required minlength="8"><br><br>

    <p>Gender</p>
    <input type="radio" id="male" name="gender" value="male" required>
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label><br><br>

    <label for="country">Country</label><br>
    <select id="country" name="country" required>
      <option value="">Choose a country</option>
      <option value="jordan">Jordan</option>
      <option value="egypt">Saudi Arabia</option>
      <option value="other">Other</option>
    </select><br><br>

    <label for="message">About You</label><br>
    <textarea id="message" name="message" rows="4" cols="30" required minlength="10"></textarea><br><br>

    <input type="checkbox" id="agree" name="agree" required>
    <label for="agree">I agree to the terms</label><br><br>

    <button type="submit">Register</button>

  </form>
</body>
</html>
